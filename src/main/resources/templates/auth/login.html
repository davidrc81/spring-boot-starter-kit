<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Spring Boot Starter Kit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4 fw-bold text-primary">Starter Kit UI</h4>

          <!-- Mensaje de error en login si falla la autenticación -->
          <div th:if="${param.error}" class="alert alert-danger py-2 fs-6">
            Usuario o contraseña incorrectos.
          </div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="Ingresá tu usuario">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">Ingresar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
