<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Gestión de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Navbar reutilizable -->
<div th:replace="~{layout/navbar :: navbar}"></div>

<main class="container my-4 flex-grow-1">
    <!-- Formulario para Agregar Producto -->
    <div class="card shadow-sm border-0 p-4 mb-4">
        <h4 class="card-title text-primary mb-3">Agregar Nuevo Producto</h4>
        <form th:action="@{/admin/productos/guardar}" th:object="${nuevoProducto}" method="post" class="row g-3">
            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre del Producto</label>
                <input type="text" th:field="*{nombre}" class="form-control" id="nombre" placeholder="Ej: Teclado Mecánico" required>
            </div>
            <div class="col-md-4">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" step="0.01" th:field="*{precio}" class="form-control" id="precio" placeholder="0.00" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-success w-100">Guardar</button>
            </div>
        </form>
    </div>

    <!-- Tabla de Productos -->
    <div class="card shadow-sm border-0 p-4">
        <h4 class="card-title text-dark mb-3">Listado de Productos</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prod : ${productos}">
                    <td th:text="${prod.id}">1</td>
                    <td th:text="${prod.nombre}">Producto Ejemplo</td>
                    <td th:text="${'$' + prod.precio}">$0.00</td>
                    <td class="text-center">
                        <a th:href="@{/admin/productos/eliminar/{id}(id=${prod.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Seguro que querés eliminar este producto?');">
                            Eliminar
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="4" class="text-center text-muted">No hay productos registrados en el sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="bg-white text-center text-muted py-3 border-top mt-auto">
    <small>&copy; 2026 StartedKit - Spring Boot 3 & Thymeleaf Premium Edition</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
