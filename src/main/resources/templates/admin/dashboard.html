<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Starter Kit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Spring Boot 3 Starter Kit - Panel Admin</span>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
    </div>
</nav>

<div class="container my-5">
    <div class="card shadow-sm border-0 p-4">
        <h2 class="text-success fw-bold">¡Bienvenido al Panel de Control!</h2>
        <p class="text-muted">Autenticación híbrida (Form Login para Thymeleaf y JWT para API REST) funcionando correctamente.</p>
        <hr>
        <p>Estado del sistema: <span class="badge bg-success">Online (Java 21 / Spring Boot 3.3.5)</span></p>
    </div>
</div>

</body>
</html>
