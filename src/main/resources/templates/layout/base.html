<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Incluye el Navbar -->
<div th:replace="~{layout/navbar :: navbar}"></div>

<!-- Contenido dinámico inyectado por las páginas -->
<main class="container my-4 flex-grow-1">
    <div th:insert="${viewContent}"></div>
</main>

<footer class="bg-white text-center text-muted py-3 border-top mt-auto">
    <small>&copy; 2026 StartedKit - Spring Boot 3 & Thymeleaf Premium Edition</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
